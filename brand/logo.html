<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  #stage { width: 1024px; height: 1024px; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#161318" />
      <stop offset="100%" stop-color="#0b0a0c" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)" />

  <!-- faint inner hairline for depth -->
  <circle cx="512" cy="512" r="252" fill="none" stroke="#2a2730" stroke-width="1.5" opacity="0.5" />

  <!-- verdict-dial track + solar arc, gap crowned at top -->
  <g transform="rotate(-90 512 512)">
    <circle cx="512" cy="512" r="312" fill="none" stroke="#26232c" stroke-width="18" />
    <circle cx="512" cy="512" r="312" fill="none" stroke="#e8a13a" stroke-width="18"
            stroke-linecap="round" stroke-dasharray="1728 232" stroke-dashoffset="-116" />
  </g>

  <!-- Saiph: a single four-point star crowning the opening -->
  <g filter="url(#glow)">
    <path fill="#f2c572"
      d="M512 122
         L529 195 L586 200
         L529 205 L512 278
         L495 205 L438 200
         L495 195 Z" />
  </g>

  <!-- serif monogram, warm off-white -->
  <text x="512" y="640" text-anchor="middle"
        font-family="Fraunces, Georgia, serif" font-weight="600" font-size="360"
        fill="#eae6e0">S</text>

  <rect width="1024" height="1024" rx="220" filter="url(#grain)" opacity="0.05" />
</svg>
</body>
</html>
