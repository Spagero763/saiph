<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  #stage { width: 1500px; height: 500px; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141216" />
      <stop offset="100%" stop-color="#0b0a0c" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)" />

  <!-- Orion line-work, faint solar -->
  <g stroke="#e8a13a" fill="none" opacity="0.22">
    <polyline points="980,120 1060,190 1120,110 1210,170 1300,90 1360,200 1440,140"
              stroke-width="1.5" />
  </g>
  <g fill="#c67f1c" opacity="0.55">
    <circle cx="980" cy="120" r="3.5" /><circle cx="1060" cy="190" r="3" />
    <circle cx="1120" cy="110" r="3" /><circle cx="1210" cy="170" r="3.5" />
    <circle cx="1300" cy="90" r="3" /><circle cx="1360" cy="200" r="3" />
    <circle cx="1440" cy="140" r="3.5" />
  </g>

  <!-- large dial arc bleeding off the right edge -->
  <g transform="rotate(-90 1440 250)">
    <circle cx="1440" cy="250" r="300" fill="none" stroke="#26232c" stroke-width="22" />
    <circle cx="1440" cy="250" r="300" fill="none" stroke="#e8a13a" stroke-width="22"
            stroke-linecap="round" stroke-dasharray="1470 1885" stroke-dashoffset="0" opacity="0.9" />
  </g>
  <path filter="url(#soft)" fill="#f2c572" transform="translate(1440 -20) scale(0.55)"
    d="M0 0 L17 73 L74 78 L17 83 L0 156 L-17 83 L-74 78 L-17 73 Z" />

  <!-- wordmark + line -->
  <text x="96" y="250" font-family="Fraunces, Georgia, serif" font-weight="600"
        font-size="128" fill="#eae6e0">Saiph</text>

  <text x="100" y="322" font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="24" letter-spacing="2" fill="#8a8494">
    It doesn’t guess what you’re exposed to.
  </text>
  <text x="100" y="366" font-family="Fraunces, Georgia, serif" font-style="italic"
        font-weight="500" font-size="34" fill="#e8a13a">
    It proves it.
  </text>

  <rect x="100" y="404" width="120" height="3" rx="1.5" fill="#c67f1c" />

  <rect width="1500" height="500" filter="url(#grain)" opacity="0.05" />
</svg>
</body>
</html>
